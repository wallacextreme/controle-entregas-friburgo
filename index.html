});
document.getElementById('btnInstallPwa').addEventListener('click', () => {
    if (deferredPWAPrompt) { deferredPWAPrompt.prompt(); deferredPWAPrompt = null; }
    document.getElementById('pwaBanner').classList.remove('visible');
});
document.getElementById('btnDismissPwa').addEventListener('click', () => {
    document.getElementById('pwaBanner').classList.remove('visible');
});

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
            reg.onupdatefound = () => {
                const w = reg.installing;
                w.onstatechange = () => {
                    if (w.state === 'activated') showToast('App atualizado! Recarregue para aplicar.', 'info');
                };
            };
        }).catch(() => { /* SW not available, ignore for local file usage */ });
    });
}

/* ================================================================
   15. TIMER — update time badges every 30s
   ================================================================ */
function startTimer() {
    if (AppState.timerRef) clearInterval(AppState.timerRef);
    AppState.timerRef = setInterval(() => {
        if (AppState.currentView === 'expedicao') {
            document.querySelectorAll('.k-card[data-status="OUT_FOR_DELIVERY"], .k-card[data-status="PREPARO"], .k-card[data-status="READY"], .k-card[data-status="RETURN_PENDING"]').forEach(card => {
                const id = parseInt(card.dataset.id);
                const d = AppState.deliveries.find(x => x.id === id);
                if (!d) return;
                const badge = card.querySelector('.k-card-time');
                if (!badge) return;

                const st = d.logistics?.status;
                if (st === STATUS.OUT_FOR_DELIVERY && d.timestamps?.departedAt) {
                    const min = getElapsedMin(d.timestamps.departedAt);
                    const dist = isDistrictNeighborhood(d.destination?.bairro);
                    const lvl = getDelayLevel(min, dist);
                    badge.textContent = min + ' min'; badge.className = 'k-card-time delay-' + lvl;
                } else if (st === STATUS.RETURN_PENDING) {
                    const refTime = d.timestamps?.returnedAt || d.updatedAt || d.timestamps?.departedAt;
                    const min = getElapsedMin(refTime);
                    badge.textContent = '↩ ' + min + ' min'; badge.className = 'k-card-time delay-red';
                } else if (st === STATUS.PREPARO && d.timestamps?.createdAt) {
                    const min = getElapsedMin(d.timestamps.createdAt);
                    badge.textContent = min + ' min'; badge.className = 'k-card-time delay-green';
                } else if (st === STATUS.READY && d.timestamps?.readyAt) {
                    const min = getElapsedMin(d.timestamps.readyAt);
                    badge.textContent = min + ' min'; badge.className = 'k-card-time delay-' + (min > 15 ? 'yellow' : 'green');
                }
            });
            renderDashboard();
        } else if (AppState.currentView === 'motoboy') {
            document.querySelectorAll('.m-card-timer').forEach(el => {
                const card = el.closest('.m-card');
                if (!card) return;
                const id = parseInt(card.dataset.id);
                const d = AppState.deliveries.find(x => x.id === id);
                if (!d || !d.timestamps?.departedAt) return;
                const min = getElapsedMin(d.timestamps.departedAt);
                const lvl = getDelayLevel(min, isDistrictNeighborhood(d.destination?.bairro));
                el.textContent = min + ' min em rota';
                el.className = 'm-card-timer delay-' + lvl;
            });
        }
    }, APP_CONFIG.timerIntervalMs);
}

/* ================================================================
   16. RENDER ALL
   ================================================================ */
async function refreshAndRender() {
    await refreshData();
    renderDashboard();
    renderKanban();
    if (AppState.currentView === 'motoboy') renderMotoboyView();
    if (AppState.currentView === 'acerto') renderAcerto();
    updateMotoboySelects();
}

/* ================================================================
   17. BOOTSTRAP
   ================================================================ */
(async function init() {
    /* Theme */
    try { const t = localStorage.getItem(APP_CONFIG.themeKey); if (t === 'dark') { document.body.setAttribute('data-theme','dark'); document.getElementById('btnTheme').textContent = '☀️'; } } catch(e){}

    /* Date displays */
    document.getElementById('headerDate').textContent = new Date().toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'short' });
    document.getElementById('acertoDate').value = todayISO();

    try {
        await DB.open();

        /* Run migration */
        const migrated = await migrateData();
        if (migrated > 0) showToast(`${migrated} registros migrados do sistema anterior`, 'info');

        /* Load data */
        await refreshData();

        /* Restore motoboy selection */
        try { const ms = localStorage.getItem(APP_CONFIG.motoboySelectionKey); if (ms) document.getElementById('motoboyViewSelect').value = ms; } catch(e){}

        /* Render */
        renderDashboard();
        renderKanban();
        updateMotoboySelects();
        startTimer();

    } catch (err) {
        showToast('Erro ao inicializar: ' + err.message, 'error');
        console.error('Init error:', err);
    }
})();
</script>
</body>
